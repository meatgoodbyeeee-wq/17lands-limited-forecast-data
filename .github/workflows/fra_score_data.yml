name: FRA score data (PENDING_FRA / G1 v2)
on:
  push:
    branches: [research/fra-score]
    paths: [.github/workflows/fra_score_data.yml]
permissions:
  contents: write
jobs:
  fra:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: GIH (same script as the past sets)
        run: python scripts/aggregate_17lands.py --set FRA --out-dir out
      - name: Colour pairs (item 8)
        run: python scripts/deck_pair_aggregate.py --set FRA --allow-fra --out-dir out
      - name: Commit results
        run: |
          mkdir -p research/fra_check/data
          cp out/FRA_gih_28d.csv out/FRA_manifest.json out/FRA_pairs.csv out/FRA_pair_manifest.json research/fra_check/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add research/fra_check/data
          git commit -m "FRA public game data aggregate for scoring"
          git push
