name: Singularity early-window ratings (past sets, descriptive)
on:
  workflow_dispatch:
  push:
    branches: [research/fra-singularity]
    paths:
      - scripts/singularity_api.py
      - .github/workflows/singularity_api.yml
permissions:
  contents: write
concurrency:
  group: singularity-api
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fra-singularity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch early-window ratings for past sets (FRA is refused by the script)
        run: |
          python scripts/singularity_api.py --out-dir research/fra_singularity/api --sets \
            GRN RNA WAR M20 ELD THB IKO M21 ZNR KHM STX AFR MID VOW NEO SNC DMU BRO ONE MOM LTR WOE LCI MKM OTJ BLB DSK FDN DFT TDM FIN EOE TLA ECL TMT SOS MSH HOB DOM M19
      - name: Commit data to the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/fra_singularity/api
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Early-window ratings for past sets'
          git pull --rebase origin research/fra-singularity
          git push origin HEAD:research/fra-singularity
