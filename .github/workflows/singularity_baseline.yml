name: Singularity baseline (past Standard sets, descriptive)
on:
  workflow_dispatch:
  push:
    branches: [research/fra-singularity]
    paths:
      - scripts/singularity_baseline.py
      - .github/workflows/singularity_baseline.yml
permissions:
  contents: write
concurrency:
  group: singularity-baseline
  cancel-in-progress: false
jobs:
  aggregate:
    strategy:
      fail-fast: false
      matrix:
        set: [DOM, M19, GRN, RNA, WAR, M20, ELD, THB, IKO, M21, ZNR, KHM, STX, AFR, MID, VOW, NEO, SNC, DMU, BRO,
              ONE, MOM, LTR, WOE, LCI, MKM, OTJ, BLB, DSK, FDN, DFT, TDM, FIN, EOE, TLA, ECL, TMT, SOS, MSH, HOB]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python scripts/singularity_baseline.py --set ${{ matrix.set }} --out-dir out
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: singularity-${{ matrix.set }}
          path: |
            out/${{ matrix.set }}_sets.json
            out/${{ matrix.set }}_cards.csv
          if-no-files-found: ignore
          retention-days: 30
  collect:
    needs: aggregate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/fra-singularity
      - uses: actions/download-artifact@v4
        with:
          pattern: singularity-*
          merge-multiple: true
          path: research/fra_singularity/data
      - name: Commit data to the research branch
        run: |
          ls -la research/fra_singularity/data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/fra_singularity/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Singularity baseline aggregates (past Standard sets)'
          git pull --rebase origin research/fra-singularity
          git push origin HEAD:research/fra-singularity
