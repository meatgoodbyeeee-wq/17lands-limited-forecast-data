name: Format Speed External Mechanism
on:
  push:
    branches: [deck-color-analysis-20260924]
    paths:
      - analysis/format_speed_external_mechanism.py
      - analysis/format_speed_mechanism_effects.py
      - .github/workflows/format_speed_external_mechanism.yml
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.5.3 pandas==3.0.6 scikit-learn==1.9.1
      - name: Reuse FIN-blind feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p devfeat
          gh run download 35835189360 -n fin-blind-dev-feature-table -D devfeat
          test -f devfeat/dev_feature_table.csv
      - name: External validation
        run: python analysis/format_speed_external_mechanism.py devfeat/dev_feature_table.csv speed_external
      - uses: actions/upload-artifact@v4
        with:
          name: format-speed-external-mechanism
          path: speed_external/
          retention-days: 30
