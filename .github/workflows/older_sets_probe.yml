name: Older sets probe (metadata only)
on:
  workflow_dispatch:
  push:
    branches: [research/older-sets-probe]
    paths:
      - scripts/older_sets_probe.py
      - .github/workflows/older_sets_probe.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/older_sets_probe.py
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/older_sets/probe.json
          git commit -m 'Older sets probe result'
          git pull --rebase origin research/older-sets-probe
          git push origin HEAD:research/older-sets-probe
