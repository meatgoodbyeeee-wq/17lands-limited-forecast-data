name: External Format Speed Validation
on:
  push:
    branches: [deck-color-analysis-20260924]
    paths:
      - analysis/format_speed_external_validate.py
      - .github/workflows/format_speed_external_validate.yml
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.5.3 pandas==3.0.6 scikit-learn==1.9.1
      - name: Reuse FIN-blind feature artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p devfeat speed21
          gh run download 35835189360 -n fin-blind-dev-feature-table -D devfeat
          gh run download 36070294231 -n format-speed-no-mh3 -D speed21
          test -f devfeat/dev_feature_table.csv
          test -f speed21/format_speed_no_mh3.json
      - run: python analysis/format_speed_external_validate.py devfeat/dev_feature_table.csv speed21/format_speed_no_mh3.json external_speed
      - uses: actions/upload-artifact@v4
        with:
          name: external-format-speed-validation
          path: external_speed/
          retention-days: 30
