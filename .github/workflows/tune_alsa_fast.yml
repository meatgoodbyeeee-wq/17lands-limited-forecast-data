name: Fast FIN-blind ALSA tuning
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/tune_alsa_fast_loso.py
      - .github/workflows/tune_alsa_fast.yml
permissions:
  actions: read
  contents: read
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas scipy scikit-learn
      - name: Validate tuning script syntax and audit wiring
        run: |
          python -m py_compile scripts/tune_alsa_fast_loso.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path("scripts/tune_alsa_fast_loso.py").read_text()
          tree=ast.parse(s)
          strings={n.value for n in ast.walk(tree) if isinstance(n, ast.Constant) and isinstance(n.value,str)}
          if "ALSA_ADOPTED_MODEL" not in strings:
              raise SystemExit("ALSA_ADOPTED_MODEL is not executable Python")
          required={"pair_removal_draw_plus_mana_fix","alsa_sem_mana_fix"}
          missing=sorted(required-strings)
          if missing:
              raise SystemExit("Missing adopted ALSA wiring: "+", ".join(missing))
          bad=[line for line in s.splitlines() if line.lstrip().startswith("#") and "\\n" in line]
          if bad:
              raise SystemExit("Literal backslash-n found inside comment")
          PY
      - name: Download cached FIN-blind development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35835189360 -n fin-blind-dev-feature-table -D cached
      - name: Verify FIN absent
        run: |
          python - <<'PY'
          import pandas as pd
          for f in ["cached/dev_feature_table.csv","cached/dev_alsa_actuals.csv"]:
              d=pd.read_csv(f)
              assert "FIN" not in set(d["set"].astype(str).str.upper()), f
          print("FIN_USED=false")
          PY
      - name: Run ALSA-only candidate sweep
        run: python scripts/tune_alsa_fast_loso.py --features cached/dev_feature_table.csv --alsa cached/dev_alsa_actuals.csv --out alsa_fast_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: alsa-fast-results
          path: alsa_fast_results.json

