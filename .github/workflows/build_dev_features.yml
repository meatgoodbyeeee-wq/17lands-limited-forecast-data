name: Build FIN-blind model features
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_dev_features.py
      - scripts/train_text_ensemble_loso.py
      - scripts/audit_common_power_creep.py
      - scripts/audit_prediction_compression.py
      - scripts/audit_tail_semantics.py
      - scripts/tune_structured_loso.py
      - scripts/tune_ensemble_loso.py
      - scripts/tune_decompression_loso.py
      - scripts/train_tail_tournament_loso.py
      - .github/workflows/build_dev_features.yml
permissions:
  actions: read
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas scipy scikit-learn
      - name: Download development actuals only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training_artifacts
          for SET in KHM STX AFR MID VOW NEO SNC DMU BRO ONE MOM LTR WOE LCI MKM OTJ MH3 BLB DSK FDN DFT TDM; do
            gh run download 35692015171 -n "${SET}-28d" -D "training_artifacts/${SET}"
          done
          python - <<'PY'
          import pandas as pd, glob
          fs=glob.glob("training_artifacts/*/*_gih_28d.csv")
          if len(fs) != 22: raise SystemExit(f"Expected 22 development files, got {len(fs)}: {fs}")
          d=pd.concat([pd.read_csv(f) for f in fs],ignore_index=True)
          if "FIN" in set(d["set"].str.upper()): raise SystemExit("FIN contamination detected")
          d.to_csv("dev_actuals.csv",index=False)
          print(d.groupby("set").size())
          PY
      - name: Build pre-release features
        run: python scripts/build_dev_features.py --actuals dev_actuals.csv --out model_out/dev_feature_table.csv
      - name: Audit common power creep excluding MH3 baseline
        run: python scripts/audit_common_power_creep.py --input model_out/dev_feature_table.csv --out model_out/common_power_creep_audit.csv
      - name: Audit prediction compression FIN-blind
        run: python scripts/audit_prediction_compression.py --input model_out/dev_feature_table.csv --out model_out/prediction_compression_audit.json
      - name: Audit tail semantics FIN-blind
        run: python scripts/audit_tail_semantics.py --input model_out/dev_feature_table.csv --out model_out/tail_semantics_audit.json
      - name: Test isolated semantic features FIN-blind
        run: |
          cp scripts/build_dev_features.py /tmp/build_all.py
          for v in cast flex tribal another; do
            cp experiments/build_dev_features_semantic_${v}.py scripts/build_dev_features.py
            python scripts/build_dev_features.py --actuals data/dev_actuals.csv --out model_out/dev_feature_${v}.csv
            python scripts/train_text_ensemble_loso.py --input model_out/dev_feature_${v}.csv --out model_out/text_${v}.json
          done
          cp /tmp/build_all.py scripts/build_dev_features.py

      - name: Tune structured model FIN-blind
        run: python scripts/tune_structured_loso.py --input model_out/dev_feature_table.csv --out model_out/structured_tuning.json
      - name: Tune ensemble FIN-blind
        run: python scripts/tune_ensemble_loso.py --input model_out/dev_feature_table.csv --out model_out/ensemble_tuning.json
      - name: Tune wide decompression FIN-blind
        run: python scripts/tune_decompression_loso.py --input model_out/dev_feature_table.csv --out model_out/decompression_tuning.json
      - name: Run FIN-blind text ensemble LOSO
        run: python scripts/train_text_ensemble_loso.py --input model_out/dev_feature_table.csv --out model_out/text_ensemble_loso.json
      - name: Run FIN-blind tail tournament LOSO
        run: python scripts/train_tail_tournament_loso.py --input model_out/dev_feature_table.csv --out model_out/tail_tournament_loso.json
      - uses: actions/upload-artifact@v4
        with:
          name: fin-blind-dev-feature-table
          path: model_out/
