name: Probe Sealed Public Datasets
on:
  push:
    branches: [deck-color-analysis-20260924]
    paths:
      - analysis/sealed_dataset_probe.py
      - .github/workflows/sealed_dataset_probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analysis/sealed_dataset_probe.py
