name: External Validate Sealed GIH
on:
  push:
    branches: [deck-color-analysis-20260924]
    paths:
      - analysis/sealed_gih_external_validate.py
      - .github/workflows/sealed_gih_external_validate.yml
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.5.3 pandas==3.0.6 scipy==1.16.2 scikit-learn==1.9.1
      - name: Download training inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p devfeat sealed_agg
          gh run download 35835189360 -n fin-blind-dev-feature-table -D devfeat
          gh run download 36106288518 -n sealed-public-aggregates -D sealed_agg
      - name: External validation
        run: python analysis/sealed_gih_external_validate.py devfeat/dev_feature_table.csv sealed_agg/sealed_card_actuals.csv sealed_external
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-gih-external-validation
          path: sealed_external/
          retention-days: 30
