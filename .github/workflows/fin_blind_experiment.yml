name: FIN-blind model experiment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy scipy
      - name: Download training artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training_artifacts
          for SET in BLB DSK FDN DFT TDM; do
            gh run download 35677195972 -n "${SET}-28d" -D "training_artifacts/${SET}"
          done
      - name: Run FIN-blind LOSO evaluation
        run: python scripts/fin_blind_experiment.py --local-dir training_artifacts --out-dir model_out
      - uses: actions/upload-artifact@v4
        with:
          name: fin-blind-model-report
          path: model_out/
          retention-days: 30
