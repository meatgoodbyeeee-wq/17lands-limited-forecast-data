name: FIN-blind model experiment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy scipy
      - name: Run FIN-blind LOSO evaluation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/fin_blind_experiment.py --repo ${{ github.repository }} --run-id 35677195972 --out-dir model_out
      - uses: actions/upload-artifact@v4
        with:
          name: fin-blind-model-report
          path: model_out/
          retention-days: 30
