name: DA1 aggregate (deck-adjusted GIH)
on:
  workflow_dispatch:
  push:
    branches: [research/da1-deck-adjusted]
    paths:
      - scripts/da1_aggregate.py
      - .github/workflows/da1_aggregate.yml
permissions:
  contents: write
concurrency:
  group: da1-aggregate
  cancel-in-progress: false
jobs:
  aggregate:
    strategy:
      fail-fast: false
      matrix:
        set: [KHM, STX, AFR, MID, VOW, NEO, SNC, DMU, BRO, ONE, MOM, LTR, WOE, LCI, MKM, OTJ, BLB, DSK, FDN, DFT, TDM,
              EOE, TLA, ECL, TMT, SOS, MSH, HOB]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: cd scripts && python da1_aggregate.py --set ${{ matrix.set }} --out-dir ../out
      - uses: actions/upload-artifact@v4
        with:
          name: da1-${{ matrix.set }}
          path: |
            out/${{ matrix.set }}_da1.csv
            out/${{ matrix.set }}_da1_manifest.json
          retention-days: 7
  collect:
    needs: aggregate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/da1-deck-adjusted
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: da1-*
          merge-multiple: true
          path: parts
      - name: Combine
        run: |
          python - <<'PY'
          import glob, json, pandas as pd
          fs = sorted(glob.glob('parts/*_da1.csv'))
          df = pd.concat([pd.read_csv(f) for f in fs], ignore_index=True)
          out = 'research/da1_deck_adjusted/data'
          import os; os.makedirs(out, exist_ok=True)
          df.to_csv(out + '/da1_cards.csv.gz', index=False, compression='gzip')
          man = {json.load(open(f))['set']: json.load(open(f)) for f in sorted(glob.glob('parts/*_da1_manifest.json'))}
          json.dump(man, open(out + '/da1_manifests.json', 'w'), indent=1)
          print(len(fs), 'sets', len(df), 'cards')
          PY
      - name: Commit data to the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/da1_deck_adjusted/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'DA1 aggregates (28 sets)'
          git pull --rebase origin research/da1-deck-adjusted
          git push origin HEAD:research/da1-deck-adjusted
